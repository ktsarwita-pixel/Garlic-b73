<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><title>Last Corridor</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1><span><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="assets/icons.svg#star"/></svg></span> LAST CORRIDOR</h1><nav><button id="sound" aria-pressed="true" aria-label="Toggle sound"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="assets/icons.svg#sound"/></svg></button><button id="pause" aria-label="Pause game"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="assets/icons.svg#pause"/></svg></button><button id="full" aria-label="Toggle fullscreen"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="assets/icons.svg#full"/></svg></button></nav></header><section class="world"><div class="boss"><small id="encounter">ENCOUNTER 01</small><h2>Sans</h2><div class="meter"><i id="bossbar"></i></div></div><div class="turn">TURN <b id="turn">01</b></div><canvas id="scene" width="360" height="180"></canvas></section><section class="console"><div class="inner"><div class="readout"><div class="human"><b><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="assets/icons.svg#heart"/></svg></b> HUMAN <span>LV 1</span></div><div class="health">HP <div class="meter"><i id="hpbar"></i></div><strong id="hpnum">20 / 20</strong></div></div><div class="dialog"><em><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="assets/icons.svg#star"/></svg></em><span id="message" aria-live="polite">A familiar grin blocks your path.</span><i>▾</i></div><div class="actions"><button data-a="fight"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="assets/icons.svg#fight"/></svg>FIGHT</button><button data-a="act"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="assets/icons.svg#act"/></svg>ACT</button><button data-a="item"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="assets/icons.svg#item"/></svg>ITEM</button><button data-a="mercy"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="assets/icons.svg#mercy"/></svg>MERCY</button></div><footer><span class="desktop">WASD / Arrows <b>Move</b>　 Space <b>Fight</b></span><span class="mobile">Drag inside the arena to move</span><span id="phase">READY</span></footer></div></section></main><script src="game.js"></script></body></html>
